<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTRPG Character Sheet</title>
<style>
:root {
--bg-color: #0f1115;
--card-bg: #1a1d24;
--border-color: #2a2e39;
--text-main: #f0f2f5;
--text-muted: #94a3b8;
--accent: #38bdf8;
}
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
background-color: var(--bg-color);
color: var(--text-main);
margin: 0;
padding: 1rem;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
}
.sheet-container {
width: 100%;
max-width: 480px;
background-color: var(--card-bg);
border: 1px solid var(--border-color);
border-radius: 12px;
padding: 1.5rem;
box-shadow: 0 10px 25px rgba(0,0,0,0.5);
box-sizing: border-box;
}
h1 {
margin-top: 0;
margin-bottom: 0.5rem;
font-size: 1.8rem;
letter-spacing: -0.025em;
}
.stats-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 1rem;
margin: 1.5rem 0;
}
.stat-box {
background: rgba(255, 255, 255, 0.03);
border: 1px solid var(--border-color);
padding: 1rem;
border-radius: 8px;
text-align: center;
}
.stat-label {
font-size: 0.85rem;
color: var(--text-muted);
text-transform: uppercase;
letter-spacing: 0.05em;
margin-bottom: 0.25rem;
}
.stat-value {
font-size: 1.8rem;
font-weight: 700;
color: var(--accent);
}
.section-title {
font-size: 0.9rem;
color: var(--text-muted);
text-transform: uppercase;
letter-spacing: 0.05em;
margin-bottom: 0.5rem;
border-bottom: 1px solid var(--border-color);
padding-bottom: 0.25rem;
}
.bio-box {
font-size: 0.95rem;
line-height: 1.6;
color: #cbd5e1;
background: rgba(0, 0, 0, 0.2);
padding: 1rem;
border-radius: 8px;
white-space: pre-wrap;
word-break: break-word;
}
</style>
</head>
<body>
<div class="sheet-container">
<h1 id="char-name">Loading...</h1>
<div class="stats-grid">
<div class="stat-box">
<div class="stat-label">Challenge (CL)</div>
<div class="stat-value" id="char-cl">-</div>
</div>
<div class="stat-box">
<div class="stat-label">Max Health (HP)</div>
<div class="stat-value" id="char-hp">-</div>
</div>
</div>
<div class="section-title">Backstory</div>
<div class="bio-box" id="char-bio">No backstory recorded.</div>
</div>
<script>
const urlParams = new URLSearchParams(window.location.search);
const rawData = urlParams.get('data');
if (rawData) {
const parts = rawData.split('|');
const data = {};
parts.forEach(part => {
const separatorIndex = part.indexOf(':');
if (separatorIndex !== -1) {
const key = part.substring(0, separatorIndex).trim().toLowerCase();
const value = part.substring(separatorIndex + 1).trim();
data[key] = decodeURIComponent(value);
}
});
document.getElementById('char-name').innerText = data.name || 'Unknown Character';
document.getElementById('char-cl').innerText = data.cl || '6';
document.getElementById('char-hp').innerText = data.hp || '24';
if (data.bio) {
document.getElementById('char-bio').innerText = data.bio;
}
} else {
document.getElementById('char-name').innerText = "No Save State Found";
document.getElementById('char-bio').innerText = "Tap a valid character token to load stats.";
}
</script>
</body>
</html>
