<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NABLA Character URL Generator</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --primary: #bb86fc;
            --error: #cf6679;
            --success: #03dac6;
            --border: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 0.85rem;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 0.3rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 0.6rem;
            background: #2c2c2c;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px;
            font-size: 0.95rem;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            height: 60px;
        }

        .output-section {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .counter {
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .counter.over-limit {
            color: var(--error);
            font-weight: bold;
        }

        .url-box {
            background: #111;
            padding: 0.75rem;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
            border: 1px solid var(--border);
            margin-bottom: 0.75rem;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .toast {
            text-align: center;
            font-size: 0.8rem;
            color: var(--success);
            margin-top: 0.5rem;
            height: 1.2rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>NABLA Character URL Generator</h1>
        <br>

        <div id="urlForm">
            <div class="form-group">
                <div class="label-row"><label for="name">Name</label><span class="field-count" data-for="name">0</span>
                </div>
                <input type="text" id="name" value="Jimmy_Fogler">
            </div>

            <div class="form-group">
                <div class="label-row"><label for="cl">Challenge Level (CL)</label><span class="field-count"
                        data-for="cl">0</span></div>
                <select id="cl">
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5" selected>5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>
            </div>

            <div class="form-group">
                <div class="label-row"><label for="hp">Health Points (HP)</label><span class="field-count"
                        data-for="hp">0</span></div>
                <input type="number" id="hp" value="16" readonly>
            </div>

            <div class="form-group">
                <div class="label-row"><label for="status">Status</label><span class="field-count"
                        data-for="status">0</span></div>
                <input type="text" id="status" value="Apprentice" readonly>
            </div>

            <div class="form-group">
                <div class="label-row"><label for="byr">Birth Year (byr)</label><span class="field-count"
                        data-for="byr">0</span></div>
                <input type="text" id="byr" value="+1920">
            </div>

            <div class="form-group">
                <div class="label-row"><label for="oyr">Origin Year (oyr)</label><span class="field-count"
                        data-for="oyr">0</span></div>
                <input type="text" id="oyr" value="+1942">
            </div>

            <div class="form-group">
                <div class="label-row"><label for="oloc">Origin Location (oloc)</label><span class="field-count"
                        data-for="oloc">0</span></div>
                <input type="text" id="oloc" value="New_York_City,_USA">
            </div>

            <div class="form-group">
                <div class="label-row"><label for="mc">Missions Completed (MC)</label><span class="field-count"
                        data-for="mc">0</span></div>
                <input type="number" id="mc" value="0">
            </div>

            <div class="form-group">
                <div class="label-row"><label for="pns">Pronouns (pns)</label><span class="field-count"
                        data-for="pns">0</span></div>
                <input type="text" id="pns" value="He/Him">
            </div>

            <div class="form-group">
                <div class="label-row"><label for="trait">Trait</label><span class="field-count"
                        data-for="trait">0</span></div>
                <input type="text" id="trait" value="First_Trait">
            </div>

            <div class="form-group">
                <div class="label-row"><label for="des">Description (des)</label><span class="field-count"
                        data-for="des">0</span></div>
                <textarea id="des">A_short_description_of_this_persons_physical_appearance_and_quirks</textarea>
            </div>

            <div class="form-group">
                <div class="label-row"><label for="bio">Bio</label><span class="field-count" data-for="bio">0</span>
                </div>
                <textarea
                    id="bio">This_persons_background_information_and_how_they_came_to_join_the_corporation</textarea>
            </div>

            <div class="form-group">
                <div class="label-row"><label for="lang">Language(s)</label><span class="field-count"
                        data-for="lang">0</span></div>
                <input type="text" id="lang" value="English">
            </div>

            <div class="form-group">
                <div class="label-row"><label for="allegiance">Allegiance</label><span class="field-count"
                        data-for="allegiance">0</span></div>
                <input type="text" id="allegiance" value="Department of Extra-Liminal Timespace Affairs">
            </div>


        </div>

        <div class="output-section">
            <div class="counter" id="counterBox">
                <span>Total: <span id="charCount">0</span> / 450 bytes</span>
                <span id="limitStatus">OK</span>
            </div>
            <div class="url-box" id="urlOutput"></div>
            <button id="copyBtn">Copy URL to Clipboard</button>
            <div class="toast" id="toast"></div>
        </div>
    </div>

    <script>
        const baseUrl = "https://746a.github.io/projects/char-coins.html";
        const inputs = document.querySelectorAll('#urlForm input, #urlForm textarea, #urlForm select');
        const clSelect = document.getElementById('cl');
        const hpInput = document.getElementById('hp');
        const statusInput = document.getElementById('status');
        const urlOutput = document.getElementById('urlOutput');
        const charCount = document.getElementById('charCount');
        const counterBox = document.getElementById('counterBox');
        const limitStatus = document.getElementById('limitStatus');
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');

        // Mapping of Challenge Level to corresponding Status titles
        const statusMapping = {
            "2": "Civilian",
            "3": "Greenhorn",
            "4": "Novice",
            "5": "Apprentice",
            "6": "Grunt",
            "7": "Regular",
            "8": "Operative",
            "9": "Master",
            "10": "Survivor",
            "11": "Prodigy",
            "12": "Titan"
        };

        function handleClChange() {
            const clValue = parseInt(clSelect.value, 10);

            // Calculate HP as 4x CL
            hpInput.value = clValue * 4;

            // Update Status automatically based on CL mapping
            if (statusMapping[clSelect.value]) {
                statusInput.value = statusMapping[clSelect.value];
            }

            updateURL();
        }

        function updateURL() {
            const params = new URLSearchParams();

            inputs.forEach(input => {
                const val = input.value.trim();
                if (val !== "") {
                    params.append(input.id, val);

                    const counterSpan = document.querySelector(`.field-count[data-for="${input.id}"]`);
                    if (counterSpan) {
                        counterSpan.textContent = `${val.length} characters`;
                    }
                } else {
                    const counterSpan = document.querySelector(`.field-count[data-for="${input.id}"]`);
                    if (counterSpan) counterSpan.textContent = "0ch";
                }
            });

            const fullUrl = `${baseUrl}?${params.toString()}`;
            const byteLength = new TextEncoder().encode(fullUrl).length;

            urlOutput.textContent = fullUrl;
            charCount.textContent = byteLength;

            if (byteLength > 450) {
                counterBox.classList.add('over-limit');
                limitStatus.textContent = "OVER LIMIT";
            } else {
                counterBox.classList.remove('over-limit');
                limitStatus.textContent = "OK";
            }

            return fullUrl;
        }

        clSelect.addEventListener('change', handleClChange);

        inputs.forEach(input => {
            input.addEventListener('input', updateURL);
        });

        copyBtn.addEventListener('click', () => {
            const url = updateURL();
            navigator.clipboard.writeText(url).then(() => {
                toast.textContent = "Copied to clipboard!";
                setTimeout(() => {
                    toast.textContent = "";
                }, 2000);
            });
        });

        inputs.forEach(input => {
            input.addEventListener('input', (e) => {
                // Only apply to text/textarea inputs, not selects or numbers
                if (e.target.type === 'text' || e.target.tagName === 'TEXTAREA') {
                    e.target.value = e.target.value.replace(/\s+/g, '_');
                }
                updateURL();
            });
        });

        // Initial run
        updateURL();
    </script>

</body>

</html>
