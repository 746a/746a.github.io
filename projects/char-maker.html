<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NABLA Character URL Generator</title>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --primary: #bb86fc;
            --error: #cf6679;
            --success: #03dac6;
            --border: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        h2 {
            font-size: 1rem;
            margin: 1.2rem 0 0.6rem 0;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.3rem;
        }

        .form-group {
            margin-bottom: 0.85rem;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 0.3rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 0.6rem;
            background: #2c2c2c;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px;
            font-size: 0.95rem;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            height: 60px;
        }

        .body-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-bottom: 0.5rem;
            background: #181818;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .body-row-label {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: bold;
            grid-column: span 3;
            margin-bottom: 2px;
        }

        .output-section {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .counter {
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .counter.over-limit {
            color: var(--error);
            font-weight: bold;
        }

        .url-box {
            background: #111;
            padding: 0.75rem;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
            border: 1px solid var(--border);
            margin-bottom: 0.75rem;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .toast {
            text-align: center;
            font-size: 0.8rem;
            color: var(--success);
            margin-top: 0.5rem;
            height: 1.2rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>NABLA Character URL Generator</h1>
        <br>

        <div id="urlForm">
            <div class="form-group">
                <div class="label-row"><label for="name">Name</label><span class="field-count" data-for="name">0</span>
                </div>
                <input type="text" id="name" value="" placeholder="Fname Sname">
            </div>

            <div class="form-group">
                <div class="label-row"><label for="cl">Challenge Level (CL)</label><span class="field-count"
                        data-for="cl">0</span></div>
                <select id="cl">
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>
            </div>

            <div class="form-group">
                <div class="label-row"><label for="hp">Health Points (HP)</label><span class="field-count"
                        data-for="hp">0</span></div>
                <input type="number" id="hp" value="16" readonly>
            </div>

            <div class="form-group">
                <div class="label-row"><label for="status">Status</label><span class="field-count"
                        data-for="status">0</span></div>
                <input type="text" id="status" value="Apprentice" readonly>
            </div>

            <div class="form-group">
                <div class="label-row"><label for="byr">Birth Year (byr)</label><span
                        class="field-count" data-for="byr">0</span></div>
                <input type="text" class="signed-number-input" id="byr" value="" placeholder="+1998">
            </div>

            <div class="form-group">
                <div class="label-row"><label for="oyr">Origin Year (oyr)</label><span
                        class="field-count" data-for="oyr">0</span></div>
                <input type="text" id="oyr" class="signed-number-input" value="" placeholder="+2020">
            </div>

            <div class="form-group">
                <div class="label-row"><label for="oloc">Origin Location (oloc)</label><span class="field-count"
                        data-for="oloc">0</span></div>
                <input type="text" id="oloc" value="" placeholder="New York City, USA">
            </div>

            <div class="form-group">
                <div class="label-row signed-number-input"><label for="mc">Missions Completed (MC)</label><span
                        class="field-count" data-for="mc">0</span></div>
                <input type="number" id="mc" value="" placeholder="12">
            </div>

            <div class="form-group">
                <div class="label-row"><label for="pns">Pronouns (pns)</label><span class="field-count"
                        data-for="pns">0</span></div>
                <input type="text" id="pns" value="" placeholder="He/Him">
            </div>

            <div class="form-group">
                <div class="label-row"><label for="trait">Trait</label><span class="field-count"
                        data-for="trait">0</span></div>
                <input type="text" id="trait" value="" placeholder="Trait Name">
            </div>

            <div class="form-group">
                <div class="label-row"><label for="des">Description (des)</label><span class="field-count"
                        data-for="des">0</span></div>
                <textarea id="des"
                    placeholder="A short description of this person's physical appearance and quirks" maxlength="50"></textarea>
            </div>

            <div class="form-group">
                <div class="label-row"><label for="bio">Bio</label><span class="field-count" data-for="bio">0</span>
                </div>
                <textarea id="bio"
                    placeholder="This person's background information and how they came to join the department" maxlength="50"></textarea>
            </div>

            <div class="form-group">
                <div class="label-row"><label for="lang">Language(s)</label><span class="field-count"
                        data-for="lang">0</span></div>
                <input type="text" id="lang" value="" placeholder="English">
            </div>

            <div class="form-group">
                <div class="label-row"><label for="allegiance">Allegiance</label><span class="field-count"
                        data-for="allegiance">0</span></div>
                <input type="text" id="allegiance" value="Department of Extra-Liminal Timespace Affairs">
            </div>

            <h2>Body</h2>

            <!-- Rows Generated Dynamically via JS -->
            <div id="bodyMatrixContainer"></div>
        </div>

        <div class="output-section">
            <div class="counter" id="counterBox">
                <span>Total: <span id="charCount">0</span> / 540 bytes</span>
                <span id="limitStatus">OK</span>
            </div>
            <div class="url-box" id="urlOutput"></div>
            <button id="copyBtn">Copy URL to Clipboard</button>
            <div class="toast" id="toast"></div>
        </div>
    </div>

    <script>


        // limits inputs to 0-9 + -
        document.querySelectorAll('.signed-number-input').forEach(input => {
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9\+\-]/g, '');
            });
        });

        const baseUrl = "https://746a.github.io/projects/char-cards.html";
        const inputs = document.querySelectorAll('#urlForm input, #urlForm textarea, #urlForm select:not(.body-select)');
        const clSelect = document.getElementById('cl');
        const hpInput = document.getElementById('hp');
        const statusInput = document.getElementById('status');
        const urlOutput = document.getElementById('urlOutput');
        const charCount = document.getElementById('charCount');
        const counterBox = document.getElementById('counterBox');
        const limitStatus = document.getElementById('limitStatus');
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');
        const bodyContainer = document.getElementById('bodyMatrixContainer');

        const bodySlots = [
            "Head", "Brain", "Eyes", "Ears", "Mouth",
            "Left Arm", "Right Arm", "Torso", "Heart", "Left Leg", "Right Leg"
        ];

        const durabilityMap = {
            "00": "-",
            "02": "Fragile",
            "03": "Artifact",
            "04": "Overcharged",
            "05": "Weak",
            "06": "Solid",
            "07": "Standard",
            "08": "Stable",
            "09": "Robust",
            "0A": "Reinforced",
            "0B": "Upgraded",
            "0C": "Masterwork"
        };

        const traitMap = {
            "00": "-",
        };

        const eraMaterialMap = {
            "00": "-",
            "21": "Flint",
            "22": "Bone",
            "23": "Wood",
            "31": "Polished Stone",
            "32": "Clay",
            "33": "Woven Plant",
            "34": "Leather",
            "35": "Copper",
            "41": "Bronze",
            "42": "Iron",
            "43": "Glass",
            "44": "Papyrus",
            "45": "Parchment",
            "46": "Concrete",
            "47": "Marble",
            "48": "Silk",
            "49": "Wool",
            "51": "Cast Iron",
            "52": "Steel",
            "53": "Paper",
            "54": "Porcelain",
            "55": "Rubber",
            "61": "Stainless Steel",
            "62": "Aluminium",
            "63": "Reinforced Concrete",
            "64": "Plastic",
            "71": "Silicon",
            "72": "Carbon Fiber",
            "73": "Polymer",
            "74": "Titanium",
            "81": "Graphene",
            "82": "Programmable Matter",
            "83": "Superconductor",
            "84": "Bioplastic",
            "91": "Bio-Matter",
            "92": "Null Field Lattice",
            "93": "Adaptive Meta-Material",
            "94": "Nanotech",
            "A1": "Atomic Lattice",
            "A2": "Polymeral Chain",
            "A3": "Picotech",
            "B1": "Stellar Construct",
            "B2": "Isotopic Prisms",
            "B3": "Femtotech",
            "C1": "Timespace Fiber",
            "C2": "Zero Point Cell",
            "C3": "Attoparticle"
        };

        // Helper function to build option tags from an object map
        function createOptions(mapObj, defaultKey) {
            let html = '';
            for (const [key, label] of Object.entries(mapObj)) {
                const selected = key === defaultKey ? 'selected' : '';
                html += `<option value="${key}" ${selected}>${label}</option>`;
            }
            return html;
        }

        // Build 11 body entry rows dynamically with dropdowns
        bodySlots.forEach((slotName, index) => {
            const rowNum = index + 1;
            const rowDiv = document.createElement('div');
            rowDiv.className = 'body-row';
            rowDiv.innerHTML = `
                <div class="body-row-label">${rowNum}. ${slotName}</div>
                <div>
                    <div class="label-row" style="font-size:0.65rem;">Durability</div>
                    <select class="body-select" data-row="${rowNum}" data-col="1">
                        ${createOptions(durabilityMap, "00")}
                    </select>
                </div>
                <div>
                    <div class="label-row" style="font-size:0.65rem;">Trait</div>
                    <select class="body-select" data-row="${rowNum}" data-col="2">
                        ${createOptions(traitMap, "00")}
                    </select>
                </div>
                <div>
                    <div class="label-row" style="font-size:0.65rem;">Material</div>
                    <select class="body-select" data-row="${rowNum}" data-col="3">
                        ${createOptions(eraMaterialMap, "00")}
                    </select>
                </div>
            `;
            bodyContainer.appendChild(rowDiv);
        });

        const bodySelects = document.querySelectorAll('.body-select');

        const statusMapping = {
            "2": "Civilian", "3": "Greenhorn", "4": "Novice", "5": "Apprentice",
            "6": "Grunt", "7": "Regular", "8": "Operative", "9": "Master",
            "10": "Survivor", "11": "Prodigy", "12": "Titan"
        };

        function handleClChange() {
            const clValue = parseInt(clSelect.value, 10);
            hpInput.value = clValue * 4;
            if (statusMapping[clSelect.value]) {
                statusInput.value = statusMapping[clSelect.value];
            }
            updateURL();
        }

        function updateURL() {
            const params = new URLSearchParams();

            // Standard fields
            inputs.forEach(input => {
                const val = input.value.trim();
                if (val !== "") {
                    params.append(input.id, val);
                    const counterSpan = document.querySelector(`.field-count[data-for="${input.id}"]`);
                    if (counterSpan) counterSpan.textContent = `${val.length} chars`;
                } else {
                    const counterSpan = document.querySelector(`.field-count[data-for="${input.id}"]`);
                    if (counterSpan) counterSpan.textContent = "0ch";
                }
            });

            // Construct body hex string (Row 1 to 11) from select values
            let bodyString = "";
            for (let r = 1; r <= 11; r++) {
                const dVal = document.querySelector(`.body-select[data-row="${r}"][data-col="1"]`).value;
                const tVal = document.querySelector(`.body-select[data-row="${r}"][data-col="2"]`).value;
                const mVal = document.querySelector(`.body-select[data-row="${r}"][data-col="3"]`).value;
                bodyString += dVal + tVal + mVal;
            }

            if (bodyString.length === 66) {
                params.append('body', bodyString);
            }

            const fullUrl = `${baseUrl}?${params.toString()}`;
            const byteLength = new TextEncoder().encode(fullUrl).length;

            urlOutput.textContent = fullUrl;
            charCount.textContent = byteLength;

            if (byteLength > 540) {
                counterBox.classList.add('over-limit');
                limitStatus.textContent = "OVER LIMIT";
            } else {
                counterBox.classList.remove('over-limit');
                limitStatus.textContent = "OK";
            }

            return fullUrl;
        }

        clSelect.addEventListener('change', handleClChange);

        inputs.forEach(input => {
            input.addEventListener('input', updateURL);
        });

        bodySelects.forEach(select => {
            select.addEventListener('change', updateURL);
        });

        copyBtn.addEventListener('click', () => {
            const url = updateURL();
            navigator.clipboard.writeText(url).then(() => {
                toast.textContent = "Copied to clipboard!";
                setTimeout(() => { toast.textContent = ""; }, 2000);
            });
        });

        inputs.forEach(input => {
            input.addEventListener('input', (e) => {
                if (e.target.type === 'text' || e.target.tagName === 'TEXTAREA') {
                    e.target.value = e.target.value.replace(/\s+/g, '_');
                }
                updateURL();
            });
        });

        updateURL();
    </script>
</body>

</html>
