<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERVS: Movie Rating Vector Space</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        #app {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        #sidebar {
            width: 380px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            font-weight: 600;
            text-align: center;
        }

        p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin: 0;
            line-height: 1.4;
            text-align: center;
        }

        textarea {
            flex: 1;
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px;
            font-family: ui-monospace, monospace;
            font-size: 0.85rem;
            resize: none;
            line-height: 1.5;
        }

        button {
            background: #ffcc00;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #2563eb;
        }

        #canvas-container {
            flex: 1;
            position: relative;
        }

        .axis-label {
            position: absolute;
            color: #f8fafc;
            font-size: 0.75rem;
            font-weight: 600;
            pointer-events: none;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            font-family: ui-monospace, monospace;
            background: rgba(15, 23, 42, 0.85);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #475569;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        #tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            pointer-events: none;
            display: none;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .credit {
            text-align: center;
            font-family: monospace;
            font-size: small;
        }
    </style>
</head>

<body>

    <div id="app">
        <div id="sidebar">
            <h1>MERVS: Movie Rating Vector Space</h1>
            <p>Paste/edit data points below (Title, Acting, Cinematography, Story scored 1 to 10):</p>
            <textarea id="data-input">Terrible Everything,1,1,1
Great Acting Only,10,1,1
Great Cinematography Only,1,10,1
Great Story Only,1,1,10
Great Acting and Cinematography,10,10,1
Great Acting and Story,10,1,10
Great Cinematography and Story,1,10,10
Great Everything,10,10,10
Mediocremaxxing,5.5,5.5,5.5</textarea>
            <button id="render-btn">Update Vector Space</button>
            <div class="credit">㊆㊃㊅ⓐ Industries</div>
        </div>
        <div id="canvas-container">
            <div id="tooltip"></div>
            <div id="label-acting" class="axis-label">Acting (X)</div>
            <div id="label-script" class="axis-label">Cinematography (Y)</div>
            <div id="label-visuals" class="axis-label">Story (Z)</div>
        </div>
    </div>

    <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        const labelActing = document.getElementById('label-acting');
        const labelScript = document.getElementById('label-script');
        const labelVisuals = document.getElementById('label-visuals');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(20, 12, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(10, 20, 15);
        scene.add(directionalLight);

        const boxGeo = new THREE.BoxGeometry(10, 10, 10);
        const boxMat = new THREE.MeshBasicMaterial({ color: 0x334155, wireframe: true, transparent: true, opacity: 0.15 });
        const boundingBox = new THREE.Mesh(boxGeo, boxMat);
        scene.add(boundingBox);

        const axisGroup = new THREE.Group();

        const createCustomAxis = (from, to, color) => {
            const points = [from, to];
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            return new THREE.Line(geo, mat);
        };

        axisGroup.add(createCustomAxis(new THREE.Vector3(-5, -5, -5), new THREE.Vector3(5, -5, -5), 0xef4444));
        axisGroup.add(createCustomAxis(new THREE.Vector3(-5, -5, -5), new THREE.Vector3(-5, 5, -5), 0x22c55e));
        axisGroup.add(createCustomAxis(new THREE.Vector3(-5, -5, -5), new THREE.Vector3(-5, -5, 5), 0x3b82f6));

        scene.add(axisGroup);

        let movieGroup = new THREE.Group();
        scene.add(movieGroup);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let interactiveMeshes = [];

        const axisPositions = {
            acting: new THREE.Vector3(5, -5, -5),
            script: new THREE.Vector3(-5, 5, -5),
            visuals: new THREE.Vector3(-5, -5, 5)
        };

        function updateHTMLCoordinates() {
            const tempVector = new THREE.Vector3();

            function updateElement(elem, pos) {
                tempVector.copy(pos);
                tempVector.project(camera);
                const x = (tempVector.x * .5 + .5) * container.clientWidth;
                const y = (tempVector.y * -.5 + .5) * container.clientHeight;
                elem.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
            }

            updateElement(labelActing, axisPositions.acting);
            updateElement(labelScript, axisPositions.script);
            updateElement(labelVisuals, axisPositions.visuals);
        }

        function mapRange(val) {
            return ((val - 1) / 9) * 10 - 5;
        }

        function parseCSV(text) {
            return text.trim().split('\n').map(line => {
                const parts = line.split(',');
                if (parts.length < 4) return null;
                return {
                    title: parts[0].trim(),
                    acting: parseFloat(parts[1]),
                    script: parseFloat(parts[2]),
                    visuals: parseFloat(parts[3])
                };
            }).filter(Boolean);
        }

        function buildVisualization() {
            while (movieGroup.children.length > 0) {
                movieGroup.remove(movieGroup.children[0]);
            }
            interactiveMeshes = [];

            const dataText = document.getElementById('data-input').value;
            const movies = parseCSV(dataText);

            const sphereGeo = new THREE.SphereGeometry(0.25, 32, 32);

            movies.forEach(movie => {
                const x = mapRange(movie.acting);
                const y = mapRange(movie.script);
                const z = mapRange(movie.visuals);

                const avgQuality = (movie.acting + movie.script + movie.visuals) / 3;
                const hue = ((avgQuality - 1) / 9) * 0.33; 

                const mat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(hue, 0.9, 0.5),
                    roughness: 0.3
                });

                const mesh = new THREE.Mesh(sphereGeo, mat);
                mesh.position.set(x, y, z);
                mesh.userData = movie;

                movieGroup.add(mesh);
                interactiveMeshes.push(mesh);

                const lineGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, 0, 0),
                    new THREE.Vector3(x, y, z)
                ]);
                const lineMat = new THREE.LineBasicMaterial({
                    color: new THREE.Color().setHSL(hue, 0.6, 0.5),
                    transparent: true,
                    opacity: 0.4
                });
                const line = new THREE.Line(lineGeo, lineMat);
                movieGroup.add(line);
            });
        }

        document.getElementById('render-btn').addEventListener('click', buildVisualization);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        container.addEventListener('mousemove', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / container.clientWidth) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / container.clientHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactiveMeshes);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                tooltip.style.display = 'block';
                tooltip.style.left = `${e.clientX - rect.left + 15}px`;
                tooltip.style.top = `${e.clientY - rect.top + 15}px`;
                tooltip.innerHTML = `<strong>${data.title}</strong><br>Acting: ${data.acting}<br>Cinematography: ${data.script}<br>Story: ${data.visuals}`;
                container.style.cursor = 'pointer';
            } else {
                tooltip.style.display = 'none';
                container.style.cursor = 'default';
            }
        });

        buildVisualization();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateHTMLCoordinates();
            renderer.render(scene, camera);
        }
        animate();
    </script>

</body>

</html>
